<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 27 - Xóa dòng trong bảng</title>
    <!-- Liên kết đến file CSS -->
    <link rel="stylesheet" href="cau27.css">
</head>
<body>

    <table id="myTable">
        <thead>
            <tr>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Tổng</th>
                <th>Chức năng</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dòng 1 -->
            <tr>
                <td><input type="number" value="2"></td>
                <td><input type="number" value="1000000"></td>
                <td><input type="number" value="2000000"></td>
                <td class="func-col">
                    <button type="button" onclick="xoaDong(this)">Xóa</button>
                </td>
            </tr>
            <!-- Dòng 2 -->
            <tr>
                <td><input type="number" value="1"></td>
                <td><input type="number" value="500000"></td>
                <td><input type="number" value="500000"></td>
                <td class="func-col">
                    <button type="button" onclick="xoaDong(this)">Xóa</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Liên kết đến file JavaScript -->
    <script src="cau27.js"></script>
</body>
</html>
